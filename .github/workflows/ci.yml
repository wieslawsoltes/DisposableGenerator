name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DisposableGenerator.slnx
      - run: dotnet build DisposableGenerator.slnx --configuration Release --no-restore
      - run: dotnet test DisposableGenerator.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - run: dotnet run --project samples/DisposableGenerator.Sample --configuration Release --no-build
      - run: dotnet run --project samples/DisposableGenerator.AvaloniaReactiveUI.Sample --configuration Release --no-build -- --smoke-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  package:
    name: Pack and verify NuGet package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DisposableGenerator.slnx
      - run: dotnet build DisposableGenerator.slnx --configuration Release --no-restore
      - run: dotnet test DisposableGenerator.slnx --configuration Release --no-build
      - run: dotnet pack src/DisposableGenerator/DisposableGenerator.csproj --configuration Release --no-build --output artifacts/packages
      - run: ./eng/verify-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.tag.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate tag and determine version
        id: tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable vMAJOR.MINOR.PATCH syntax." >&2
            exit 1
          fi
          package_version="${GITHUB_REF_NAME#v}"
          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
      - name: Validate release source
        shell: bash
        run: |
          source_version="$(dotnet msbuild src/DisposableGenerator/DisposableGenerator.csproj -nologo -getProperty:VersionPrefix)"
          if [[ "${source_version}" != "${PACKAGE_VERSION}" ]]; then
            echo "Tag version ${PACKAGE_VERSION} does not match VersionPrefix ${source_version}." >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release tag must point to a commit contained in origin/main." >&2
            exit 1
          fi
      - name: Verify NuGet publishing credentials
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "${NUGET_API_KEY}" ]]; then
            echo "The NUGET_API_KEY Actions repository secret is not configured." >&2
            exit 1
          fi

  integration:
    name: Required packed-package integration
    needs: validate
    uses: ./.github/workflows/integration.yml

  release:
    name: Publish NuGet package
    needs: [validate, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DisposableGenerator.slnx
      - run: dotnet build DisposableGenerator.slnx --configuration Release --no-restore -p:Version=${{ env.PACKAGE_VERSION }}
      - run: dotnet test DisposableGenerator.slnx --configuration Release --no-build -p:Version=${{ env.PACKAGE_VERSION }}
      - run: dotnet run --project samples/DisposableGenerator.Sample --configuration Release --no-build -p:Version=${{ env.PACKAGE_VERSION }}
      - run: dotnet run --project samples/DisposableGenerator.AvaloniaReactiveUI.Sample --configuration Release --no-build -p:Version=${{ env.PACKAGE_VERSION }} -- --smoke-test
      - run: dotnet pack src/DisposableGenerator/DisposableGenerator.csproj --configuration Release --no-build --output artifacts/packages -p:Version=${{ env.PACKAGE_VERSION }}
      - run: ./eng/verify-package.sh artifacts/packages/DisposableGenerator.${{ env.PACKAGE_VERSION }}.nupkg
      - name: Publish to NuGet
        run: dotnet nuget push artifacts/packages/DisposableGenerator.${{ env.PACKAGE_VERSION }}.nupkg --source https://api.nuget.org/v3/index.json --api-key "${NUGET_API_KEY}" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "artifacts/packages/DisposableGenerator.${PACKAGE_VERSION}.nupkg" --verify-tag --generate-notes --title "DisposableGenerator ${PACKAGE_VERSION}"
